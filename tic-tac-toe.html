<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;  
    align-items: center;
    padding: 30px;
    background: linear-gradient( 135deg, #120b2b, #241044, #35145c);
}


.game-container {
    width: 500px;
    max-width: 100%;
    padding: 20px;
    text-align: center;
    background: rgba(255, 255, 255, 0.08);
    border: 2px solid #9b7cff;
    border-radius: 25px;
    box-shadow: 0 0 30px rgba(126, 87, 255, 0.35);
}

h1 {
    color: white;
    font-size: 32px;
    letter-spacing: 2px;
    margin-bottom: 5px;
}

.subtitle {
    color: #cfc5ee;
    font-size: 14px;
    margin-bottom: 15px;
}

.players {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 15px;
}

.player {
    width: 140px;
    padding: 8px;
    background: #21133d;
    border: 2px solid #554078;
    border-radius: 12px;
    color: #cfc5ee;
    box-shadow: 0 0 15px rgba(155, 124, 255, 0.4);
}

.player span {
    display: block;
    font-size: 13px;
    margin-bottom: 5px;
}

.player strong {
    font-size: 20px;
    color: white;
}


.game-board {
    width: 240px;
    height: 240px;
    margin: 0 auto 15px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
}

.cell {
    border: 2px solid #7656b5;
    border-radius: 12px;
    background: #1d1235;
    color: white;
    font-size: 40px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

.cell:hover {
    background: #2d1b4f;
    border-color: #a98cff;
    transform: scale(1.03);
}


.result {
    background: #21133d;
    border-radius: 15px;
    padding: 10px;
    margin-bottom: 12px;
    border: 1px solid #57427d;
}

.result h2 {
    color: #72e6a5;
    font-size: 18px;
    margin-bottom: 5px;
}

.result p {
    color: #cfc5ee;
    font-size: 15px;
}

.score-box {
    display: flex;
    justify-content: space-around;
    background: #21133d;
    border-radius: 15px;
    padding: 10px;
    margin-bottom: 12px;
}

.score-box div {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.score-box span {
    color: #aaa0c5;
    font-size: 13px;
}

.score-box strong {
    color: white;
    font-size: 22px;
}


.restart {
    border: none;
    padding: 10px 22px;
    border-radius: 10px;
    background: #7651e8;
    color: white;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.restart:hover {
    background: #906fff;
    transform: scale(1.05);
}
@media (max-width: 600px) {

    body {
        padding: 15px;
    }

    .game-container {
        padding: 18px 10px;
    }

    h1 {
        font-size: 28px;
    }

    .players {
        gap: 10px;
    }

    .player {
        width: 125px;
    }

    .game-board {
        width: 240px;
        height: 240px;
    }

    .cell {
        font-size: 40px;
    }
}

    </style>
</head>
<body>


    <div class="game-container">

        <h1>TIC TAC TOE</h1>
        <p class="subtitle">Let's play the game!</p>


        
        <div class="players">

            <div class="player">
                <span>PLAYER 1</span>
                <strong>X</strong>
            </div>

            <div class="player">
                <span>PLAYER 2</span>
                <strong>O</strong>
            </div>

        </div>


        
        <div class="game-board">

            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>

            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>

            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>

        </div>


        
        <div class="result">
            <h2>PLAYER 1 WINS!</h2>
            <p>Congratulations 🎉</p>
        </div>


        
        <div class="score-box">

            <div>
                <span>PLAYER 1</span>
                <strong>2</strong>
            </div>

            <div>
                <span>DRAW</span>
                <strong>0</strong>
            </div>

            <div>
                <span>PLAYER 2</span>
                <strong>1</strong>
            </div>

        </div>
        <button class="restart">
            🔄 &nbsp; PLAY AGAIN
        </button>

    </div>

    <script src="script_TTT.js">    </script>
</body>
</html>
