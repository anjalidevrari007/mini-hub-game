<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess-the-number-game</title>
    <style>
        body h1{
            font-size: 50px;
            color:white;
            font-family: 'poppins',sans-serif;
            position: absolute;
            top: 90px;
            left: 510px;
        }
          body p{
           font-size: 18px; 
           font-family: 'poppins',sans-serif;
           color: white;

        }
        .box{
            box-shadow: 0 0 10px;
            width: 700px;
            height: 500px;
            position: absolute;
            left: 500px;
            top: 250px;
            border-radius: 20px;
            background-color: #1b1450;
            border: 2px solid #4c3c91;
        }
        input{
            position: absolute;
            left: 80px;
            top: 100px;
            padding: 10px;
            border-radius: 10px;
            font-size: 20px;
            width: 300px;
            border:4px solid rgb(125, 18, 179);
        }
        button{
            position: absolute;
            left: 450px;
            top: 100px;
            padding:10px;
            border-radius: 10px;
            font-size: 20px;
            width: 150px;
            background-color: rgb(252, 213, 35);
            font-weight: bolder;
            border:4px solid rgb(169, 130, 13);
            transition: all 0.3s ease-in-out;
        }
        button:hover{
            background-color: rgb(246, 198, 27);
            transform: scale(1.1);
        }
        #line{
            position: absolute;
            top: 670px;
            left: 750px;
            font-size: 20px;
        }
        .line{
            width: 650px;
            height: 100px;
            border: 2px dashed white;
            border-radius: 10px;
            position: absolute;
            top: 180px;
            left: 25px;
        }
        .line h2{
            color: white;
            font-weight: bolder;
            font-size: 30px;
            position: absolute;
            top: -10px;
            left: 70px;
        }
        .line p{
            position: absolute;
            top: 40px;
            left: 70px;
        }
        .line span{
            font-size: 50px;
            position: absolute;
            top: 13px;
        }
    .score-box {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 80%;
    margin: 20px auto;
    padding: 15px;
    border: 2px solid #ddd;
    border-radius: 12px;
    background-color: #fafafa;
    position: absolute;
    top: 300px;
    left: 50px;
}

.score-item {
    width: 45%;
    text-align: center;
    
}

.score-item h3 {
    margin: 0;
    color: #222;
    font-size: 18px;
}

.score-item p {
    margin: 8px 0 0;
    font-size: 28px;
    font-weight: bold;
    color: #5b2bbf;
}

.line1 {
    width: 2px;
    height: 60px;
    background-color: #ddd;
}
   @media (max-width: 600px) {

    body {
        overflow-x: hidden;
    }

    h1 {
        font-size: 32px;
        position: static;
        text-align: center;
        margin-top: 30px;
    }

    body > p {
        position: static !important;
        text-align: center;
        font-size: 15px;
        margin: 10px 15px;
    }

    .box {
        width: 90%;
        height: 560px;
        position: relative;
        left: auto;
        top: auto;
        margin: 30px auto;
        box-sizing: border-box;
    }

    .box > p {
        position: static !important;
        text-align: center;
        font-size: 18px;
        padding: 20px 10px 10px;
    }

    input {
        position: static !important;
        display: block;
        width: 80%;
        box-sizing: border-box;
        margin: 20px auto 10px;
        font-size: 18px;
    }

    button {
        position: static !important;
        display: block;
        width: 50%;
        margin: 15px auto;
        font-size: 18px;
        padding: 12px;
    }

    .line {
        position: static !important;
        width: 85%;
        height: auto;
        min-height: 150px;
        margin: 25px auto;
        box-sizing: border-box;
        padding: 15px;
        text-align: center;
    }

    .line h2 {
        position: static !important;
        font-size: 24px;
        margin: 5px 0 15px;
    }

    .line p {
        position: static !important;
        font-size: 15px;
        margin: 10px 0;
    }

    .line span {
        position: static !important;
        font-size: 35px;
        display: block;
        margin: 5px;
    }

    .score-box {
        position: static !important;
        width: 85%;
        margin: 25px auto;
        padding: 12px;
        box-sizing: border-box;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .score-item {
        width: 45%;
        text-align: center;
    }

    .score-item h3 {
        font-size: 15px;
        margin: 0;
    }

    .score-item p {
        font-size: 24px;
        margin: 8px 0;
    }

    .line1 {
        width: 2px;
        height: 50px;
    }

    #line {
        position: static !important;
        text-align: center;
        font-size: 15px;
        margin: 15px auto;
    }
}
    </style>
</head>
<body style="background-color: #0b061e;">
    <h1>🎯 GUESS THE NUMBER 🎯</h1>
    <p style=" position: absolute; left: 679px; top: 180px;">I have choosen a number between 1 to 100.</p>
    <p style=" position: absolute; left: 759px; top: 205px;">Can you guess it?</p>
    <div class="box">
       <p style="position: absolute; top:1px; left:230px; font-size: 25px; box-shadow: 0 0 5px; padding: 12px;"><b>Enter your guess</b></p>
       <input type="number" placeholder="Enter a number(1-100)"> 
    <button>GUESS</button>  
    <div class="line">
        <span>💡</span>
        <h2>Start Guessing...</h2>
        <p>Enter a number and click GUESS to begin!</p>
    </div>
    <div class="score-box">

    <div class="score-item">
        <h3>ATTEMPTS</h3>
        <p id="attempts">0</p>
    </div>

    <div class="line1"></div>

    <div class="score-item">
        <h3>BEST SCORE</h3>
        <p id="bestScore">-</p>
    </div>

</div>
    </div>
    <p id="line">Good Luck ! Have Fun.❤️</p>

    <script src="script_guess-number.js"></script>
</body>
</html>
