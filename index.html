    body {

    }

    p {
        position: static;

        font-size: 14px;
        margin: 10px 20px 20px;
    }

    .box {
        width: 90%;
        height: auto;
        margin: 20px auto;
        display: block;
    }

    #box1,
    #box2,
    #box3,
    #box4 {
        position: static;
        width: 85%;
        height: 300px;
        margin: 20px auto;
        display: block;
        transform: none;
    }

    #box1:hover,
    #box2:hover,
    #box3:hover,
    #box4:hover {
        transform: translateY(-10px);
    }

    button {
        width: 140px;

        margin: 10px auto;
    }

    #name {
