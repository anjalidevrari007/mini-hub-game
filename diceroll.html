<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice-Roll-Game</title>
    <style>
        h1{
           font-size: 50px; 
           font-family: 'poppins',sans-serif;
           position: absolute;
           left: 680px;
           top: 90px;
           color: white;
        }
        body p{
           font-size: 20px; 
           font-family: 'poppins',sans-serif;
           position: absolute;
           left: 759px;
           top: 180px;
           color: white;

        }
        .box{
            box-shadow: 0 0 10px;
            width: 600px;
            height: 400px;
            position: absolute;
            left: 600px;
            top: 250px;
            border-radius: 20px;
            background-color: #1b1450;
            border: 2px solid #4c3c91;
        }
        .dice{
            font-size: 200px;
            position: absolute;
            top: -30px;
            left: 220px;
            transform-style: preserve-3d;
            transition: transform 0.3s;
            color: white;
        }
        .dice:hover{
            transform: rotate(360deg) scale(1.1);
        }
        #box1{
            box-shadow: 0 0 2px;
            width: 300px;
            height: 80px;
            border-radius: 10px;
            position: absolute;
            left: 150px;
            top: 220px;
            border: 2px dashed #6b5ba8;
            color:#d2cde8;
        }
        button{
            width: 80%;
            padding:15px;
            border-radius: 12px;
            background: linear-gradient(to right,#7648e8,#a472f1);
            color: white;
            font-size: 20px;
            font-weight: bold;
            position: absolute;
            top: 320px;
            left: 55px;
        }
        .result{
            color: white;
            position: absolute;
            left: 700px;
            top: 690px;
            font-size: 25px;
            font-family: 'poppins',sans-serif;
            border: 2px solid #33286d;
            width: 400px;
            padding: 12px;
        }
        #result{
            color: #a86cff;
            font-size: 28px;
            position: absolute;
            left: 300px;
        }
        @media (max-width: 600px) {

    body {
        overflow-x: hidden;
    }

    h1 {
        font-size: 32px;
        position: static;
        text-align: center;
        margin-top: 30px;
    }

    body p {
        font-size: 16px;
        position: static;
        text-align: center;
        margin: 10px 20px;
    }

    .box {
        width: 90%;
        height: 500px;
        position: relative;
        left: auto;
        top: auto;
        margin: 30px auto;
    }

    .dice {
        font-size: 100px;
        position: absolute;
        left: 50%;
        top: 40px;
        transform: translateX(-50%);
    }

    .dice:hover {
        transform: translateX(-50%) rotate(360deg) scale(1.1);
    }

    #box1 {
        width: 80%;
        height: 80px;
        left: 10%;
        top: 200px;
    }

    button {
        width: 80%;
        position: absolute;
        left: 10%;
        top: 310px;
        font-size: 18px;
        padding: 12px;
    }

    .result {
        width: 80%;
        position: absolute;
        left: 10%;
        top: 410px;
        font-size: 20px;
        padding: 10px;
    }

    #result {
        font-size: 24px;
        position: static;
        margin-top: 10px;
    }
}
    </style>
</head>
<body style="background-color: #0b061e;">
    <h1>✨🎲Dice Roll✨</h1>
    <p>Roll the dice and test your luck ! </p>
    <div class="box">
        <div class="dice" id="dice">
        ⚀
        </div>
        <div id="box1">
           <pre style="font-size: 20px; font-weight: bolder;">  Click the button below
     to roll the dice !</pre>
        </div>
     <button id="rollButton">🎲 &nbsp; Roll Dice</button>
    </div>
    <div class="result">
        <span>🏆</span>
        <span>You rolled :</span>
        <strong id="result">-</strong>
    </div>

    <script src="script_diceroll.js"></script>
</body>
</html>
